<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1120"><link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css">
<title>AI Video Factory Pro</title></head>
<body>
<div id="login" hidden>
  <form id="loginForm" class="card narrow">
    <h1>AI Video Factory Pro</h1><p class="muted">Bulut üretim paneli</p>
    <label>E-posta<input id="email" type="email" required autocomplete="username"></label>
    <label>Parola<input id="password" type="password" required minlength="1" autocomplete="current-password"></label>
    <div class="row"><button type="submit" id="loginBtn">Giriş yap</button><button type="button" id="regBtn" class="secondary">Hesap oluştur</button></div>
    <p id="loginMsg" class="err"></p>
  </form>
</div>
<div id="app" hidden>
  <header><div class="brand"><span class="logo">✦</span> AI VIDEO FACTORY <span class="pill">PRO V2</span></div>
    <div><span id="sys" class="pill"></span> <button id="logout" class="secondary small">Çıkış</button></div></header>
  <main>
    <section class="grid" id="stats"></section>
    <div class="layout">
      <section class="card"><h2>＋ Yeni video</h2>
        <form id="createForm">
          <label>Konu<input id="topic" required minlength="3" maxlength="300" placeholder="Örn. Güneş sistemindeki en büyük 5 gezegen"></label>
          <div class="row2">
            <label>Kategori<select id="category"></select></label>
            <label>Süre (sn)<input id="duration" type="number" min="10" max="90" value="30"></label>
          </div>
          <div class="row2">
            <label>Stil<select id="style"><option value="cinematic">Sinematik</option><option value="documentary">Belgesel</option><option value="energetic">Enerjik</option><option value="minimal">Minimal</option></select></label>
            <label>Medya modu<select id="mode"><option value="hybrid">Hibrit</option><option value="ai_video">Tam AI video</option><option value="slideshow">Görsel+hareket (AI video değil)</option></select></label>
          </div>
          <div class="row2">
            <label>Kalite<select id="tier"><option value="standard">Standart</option><option value="draft">Taslak</option><option value="premium">Premium</option></select></label>
            <label>Ses<select id="gender"><option value="female">Kadın</option><option value="male">Erkek</option></select></label>
          </div>
          <div class="checks"><label><input type="checkbox" value="youtube" checked> YouTube Shorts</label><label><input type="checkbox" value="tiktok" checked> TikTok</label><label><input type="checkbox" value="instagram" checked> Instagram Reels</label></div>
          <div class="row"><button type="button" id="estBtn" class="secondary">Maliyet tahmini</button><button type="submit" id="createBtn">Üretimi başlat</button></div>
          <pre id="estimate" class="muted small"></pre>
        </form>
      </section>
      <section class="card"><h2>Üretim hattı</h2><div id="providers" class="small"></div></section>
    </div>
    <section class="card"><div class="row between"><h2>Projeler</h2><button class="secondary small" id="refresh">Yenile</button></div><div id="jobs"></div></section>
    <section class="card" id="detail" hidden></section>
  </main>
</div>
<script src="/app.js" defer></script>
</body></html>
